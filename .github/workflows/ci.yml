name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repository visibility notice
        shell: bash
        run: |
          if [ "${{ github.event.repository.visibility }}" != "private" ]; then
            echo "::warning::Repository is public by development decision. Cloudflare deploy remains blocked until it becomes private."
          fi
      - name: Security check
        run: pnpm security:check
      - name: Migration inventory
        run: pnpm migrations:check
      - name: RBAC invariants
        run: pnpm rbac:check
      - name: Privilege hardening invariants
        run: pnpm privileges:check
      - name: Invitation delegation invariants
        run: pnpm invitations:check
      - name: Membership lifecycle invariants
        run: pnpm memberships:check
      - name: Access audit invariants
        run: pnpm access-audit:check
      - name: Navigation invariants
        run: pnpm navigation:check
      - name: Access-aware navigation invariants
        run: pnpm access-navigation:check
      - name: Access landing invariants
        run: pnpm access-landing:check
      - name: Support maintenance invariants
        run: pnpm support:check
      - name: Privacy retention invariants
        run: pnpm privacy:check
      - name: Pilot readiness invariants
        run: pnpm pilot:check
      - name: HTTP security invariants
        run: pnpm http-security:check
      - name: Auth readiness invariants
        run: pnpm auth:check
      - name: Auth provider contract invariants
        run: pnpm auth-provider:check
      - name: Admin bootstrap invariants
        run: pnpm admin-bootstrap:check
      - name: Admin lifecycle invariants
        run: pnpm admin-lifecycle:check
      - name: Backup/restore readiness invariants
        run: pnpm backup:check
      - name: Evidence storage readiness invariants
        run: pnpm evidence-storage:check
      - name: Alert delivery readiness invariants
        run: pnpm alert-delivery:check
      - name: API STAGE readiness invariants
        run: pnpm api-stage:check
      - name: API security perimeter invariants
        run: pnpm api-security:check
      - name: Distributed rate limiting invariants
        run: pnpm rate-limit:check
      - name: Device key lifecycle invariants
        run: pnpm device-keys:check
      - name: Ingest replay protection invariants
        run: pnpm replay:check
      - name: Idempotency conflict invariants
        run: pnpm idempotency:check
      - name: Ingest conflict response invariants
        run: pnpm ingest-conflict:check
      - name: API idempotency contract invariants
        run: pnpm api-idempotency:check
      - name: Deploy readiness invariants
        run: pnpm deploy:check
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Automated tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Validate API STAGE Worker config
        shell: bash
        run: npx --yes wrangler@4.130.0 deploy --config apps/api/wrangler.stage.toml --dry-run --outdir "$RUNNER_TEMP/ifarm-security-api-stage-ci"
      - name: Validate Pages security artifact
        shell: bash
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/_redirects
          test -f apps/web/dist/_headers
          test -f apps/web/dist/robots.txt
          cmp apps/web/public/_headers apps/web/dist/_headers
          cmp apps/web/public/robots.txt apps/web/dist/robots.txt
