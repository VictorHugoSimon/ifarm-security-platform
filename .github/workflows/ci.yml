name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repository visibility notice
        shell: bash
        run: |
          if [ "${{ github.event.repository.visibility }}" != "private" ]; then
            echo "::warning::Repository is public by development decision. Cloudflare deploy remains blocked until it becomes private."
          fi
      - name: Security check
        run: pnpm security:check
      - name: Migration inventory
        run: pnpm migrations:check
      - name: RBAC invariants
        run: pnpm rbac:check
      - name: Privilege hardening invariants
        run: pnpm privileges:check
      - name: HTTP security invariants
        run: pnpm http-security:check
      - name: Auth readiness invariants
        run: pnpm auth:check
      - name: Deploy readiness invariants
        run: pnpm deploy:check
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Automated tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Validate Pages security artifact
        shell: bash
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/_redirects
          test -f apps/web/dist/_headers
          test -f apps/web/dist/robots.txt
          cmp apps/web/public/_headers apps/web/dist/_headers
          cmp apps/web/public/robots.txt apps/web/dist/robots.txt
