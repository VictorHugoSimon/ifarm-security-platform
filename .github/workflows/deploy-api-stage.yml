name: Deploy iFarm Security API STAGE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ifarm-security-api-stage-deploy
  cancel-in-progress: false

env:
  IFARM_SECURITY_API_STAGE_WORKER: ifarm-security-api-stage

jobs:
  deploy-api-stage:
    if: github.repository == 'VictorHugoSimon/ifarm-security-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ifarm-security-stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require private repository
        shell: bash
        run: |
          if [ "${{ github.event.repository.visibility }}" != "private" ]; then
            echo "::error::iFarm Security repository must be private before API Worker deployment. No Cloudflare or Neon secret was read by this step."
            exit 1
          fi
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: API STAGE security gates
        run: |
          pnpm security:check
          pnpm migrations:check
          pnpm rbac:check
          pnpm privileges:check
          pnpm auth:check
          pnpm auth-provider:check
          pnpm admin-bootstrap:check
          pnpm admin-lifecycle:check
          pnpm backup:check
          pnpm evidence-storage:check
          pnpm alert-delivery:check
          pnpm api-stage:check
          pnpm api-security:check
          pnpm rate-limit:check
          pnpm device-keys:check
          pnpm replay:check
          pnpm idempotency:check
          pnpm ingest-conflict:check
          pnpm api-idempotency:check
          pnpm heartbeat-ordering:check
          pnpm asset-position-ordering:check
          pnpm gps-timestamp-tie:check
          pnpm deploy-gate-parity:check
      - name: Test and typecheck API
        run: |
          pnpm --filter @ifarm-security/api test
          pnpm --filter @ifarm-security/api typecheck
      - name: Dry-run STAGE Worker bundle
        shell: bash
        run: npx --yes wrangler@4.130.0 deploy --config apps/api/wrangler.stage.toml --dry-run --outdir "$RUNNER_TEMP/ifarm-security-api-stage"
      - name: Require isolated deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.IFARM_SECURITY_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.IFARM_SECURITY_CLOUDFLARE_ACCOUNT_ID }}
          STAGE_DATABASE_URL: ${{ secrets.IFARM_SECURITY_STAGE_DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then echo "::error::Missing dedicated iFarm Security Cloudflare credentials."; exit 1; fi
          if [ -z "$STAGE_DATABASE_URL" ]; then echo "::error::Missing dedicated IFARM_SECURITY_STAGE_DATABASE_URL."; exit 1; fi
          if [[ ! "$STAGE_DATABASE_URL" =~ ^postgres(ql)?:// ]] || [[ "$STAGE_DATABASE_URL" != *".neon.tech/ifarm_security"* ]]; then echo "::error::STAGE database secret does not match the expected Neon/PostgreSQL shape for ifarm_security."; exit 1; fi
      - name: Deploy isolated API Worker
        id: deploy_api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.IFARM_SECURITY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.IFARM_SECURITY_CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.IFARM_SECURITY_STAGE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SECRET_FILE="$RUNNER_TEMP/ifarm-security-api-stage.env"
          trap 'rm -f "$SECRET_FILE"' EXIT
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > "$SECRET_FILE"
          DEPLOY_OUTPUT="$(npx --yes wrangler@4.130.0 deploy --config apps/api/wrangler.stage.toml --secrets-file "$SECRET_FILE" --strict 2>&1)"
          API_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -1 || true)"
          if [ -z "$API_URL" ]; then echo "::error::Worker deploy completed without a workers.dev URL in Wrangler output."; exit 1; fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: API smoke
        env:
          API_URL: ${{ steps.deploy_api.outputs.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_HEADERS="$RUNNER_TEMP/ifarm-security-api-health.headers"
          HEALTH="$(curl --fail --silent --show-error --max-time 20 -D "$HEALTH_HEADERS" "$API_URL/health")"
          READY="$(curl --fail --silent --show-error --max-time 20 "$API_URL/ready")"
          STATUS="$(curl --fail --silent --show-error --max-time 20 "$API_URL/api/v1/system/status")"
          printf '%s' "$HEALTH" | grep -q '"ok":true'
          grep -Eqi '^cache-control:[[:space:]]*no-store' "$HEALTH_HEADERS"
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' "$HEALTH_HEADERS"
          grep -Eqi '^x-frame-options:[[:space:]]*DENY' "$HEALTH_HEADERS"
          printf '%s' "$READY" | grep -q '"ready":true'
          printf '%s' "$READY" | grep -q '"databaseConfigured":true'
          printf '%s' "$STATUS" | grep -q '"distributedRateLimitingConfigured":true'
          printf '%s' "$STATUS" | grep -q '"humanMonitoringAssumed":false'
          printf '%s' "$STATUS" | grep -q '"publicDispatchEnabled":false'
          printf '%s' "$STATUS" | grep -q '"governmentIntegration":false'
          printf '%s' "$STATUS" | grep -q '"biometricMatching":false'
          METHOD_BODY="$RUNNER_TEMP/ifarm-security-api-method.json"
          METHOD_STATUS="$(curl --silent --show-error --max-time 20 --output "$METHOD_BODY" --write-out '%{http_code}' "$API_URL/api/v1/ingest/devices/11111111-1111-4111-8111-111111111111/heartbeat")"
          test "$METHOD_STATUS" = "405"
          grep -q '"error":"method_not_allowed"' "$METHOD_BODY"
          echo "### iFarm Security API STAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: $IFARM_SECURITY_API_STAGE_WORKER" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- health/ready/system-status/security-perimeter/distributed-rate-limit/replay/idempotency/conflict-response/api-idempotency/heartbeat-ordering/asset-position-ordering/gps-timestamp-tie smoke: passed" >> "$GITHUB_STEP_SUMMARY"
