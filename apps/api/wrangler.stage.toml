name = "ifarm-security-api-stage"
main = "src/index.ts"
compatibility_date = "2026-09-15"
workers_dev = true
preview_urls = false

[vars]
APP_ENV = "stage"
APP_NAME = "iFarm Security"

# Candidate namespaces reserved exclusively for iFarm Security STAGE.
# Deployment remains blocked until IFARM_SECURITY_RATE_LIMIT_NAMESPACES_APPROVED=true
# confirms these integer IDs do not collide with another Worker in the Cloudflare account.
[[ratelimits]]
name = "INGEST_ACTOR_RATE_LIMITER"
namespace_id = "193001"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "INGEST_ROUTE_ABUSE_GUARD"
namespace_id = "193002"

  [ratelimits.simple]
  limit = 6000
  period = 60

[triggers]
crons = ["*/5 * * * *"]

# DATABASE_URL is injected only at deploy time via Wrangler --secrets-file.
# Never commit the value and never reuse credentials from another project.
