name = "ifarm-security-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
APP_ENV = "dev"
APP_NAME = "iFarm Security"

[triggers]
crons = ["*/5 * * * *"]

# DATABASE_URL deve ser configurada como secret exclusivo do iFarm Security.
# Nenhum binding, token ou secret de outro projeto pode ser reutilizado.
